# GitHub Actions: PL/SQL tests with coverage and mutation testing (plgauge).
# Copy to .github/workflows/plsql.yml of a project with plgauge.json, adapt the thresholds.
# plgauge is cloned from GitHub (PLGAUGE_REPO below); point it to a fork or mirror if you like.
name: PL/SQL
on:
  push:
  pull_request:

env:
  PLGAUGE_REPO: https://github.com/WayneNani/plgauge.git
  PLGAUGE_REF: main

jobs:
  plsql:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                       # the diff mode needs the merge base
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: plgauge
        run: |
          git clone --depth 1 --branch "$PLGAUGE_REF" "$PLGAUGE_REPO" "$RUNNER_TEMP/plgauge"
          (cd "$RUNNER_TEMP/plgauge" && npm ci)
          echo "PLGAUGE=$RUNNER_TEMP/plgauge/bin/plgauge" >> "$GITHUB_ENV"
      - name: Oracle 23ai Free and utPLSQL
        run: echo "PLGAUGE_DB=$("$RUNNER_TEMP/plgauge/ci/setup-db.sh" | tail -1)" >> "$GITHUB_ENV"
      - name: Coverage
        run: $PLGAUGE coverage . --out coverage --min-branch 70 --min-stmt 80
      - name: Coverage of the changed code
        if: github.event_name == 'pull_request'
        run: $PLGAUGE coverage . --skip-install --out coverage-diff --diff "origin/${{ github.base_ref }}" --min-branch 80
      - name: Export for GitHub and Sonar
        if: always()
        run: |
          $PLGAUGE export coverage/coverage.json --format cobertura --src . --out coverage/cobertura.xml
          $PLGAUGE export coverage/coverage.json --format sonar --src . --out coverage/sonar.xml
          $PLGAUGE export coverage/coverage.json --format junit --out coverage/junit.xml
      - name: Mutation testing (changed code)
        if: github.event_name == 'pull_request'
        run: >
          $PLGAUGE mutate run . --skip-install --diff "origin/${{ github.base_ref }}"
          --json mutation.json --report mutation.html --min-score 60
      - name: Mutation testing (everything, nightly)
        if: github.event_name == 'schedule'
        run: $PLGAUGE mutate run . --skip-install --json mutation.json --report mutation.html
      - name: Joint report
        if: always() && hashFiles('mutation.json') != ''
        run: $PLGAUGE report coverage/coverage.json --mutation mutation.json --out joint
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plgauge-reports
          path: |
            coverage/
            coverage-diff/
            joint/
            mutation.*
