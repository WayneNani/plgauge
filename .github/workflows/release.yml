# Release on a version tag (v1.2.3): the full CI first, then the package is staged on npm through
# trusted publishing (no token in the repository) and waits there until a maintainer approves it with
# 2FA (npm stage approve). The GitHub release is created from the CHANGELOG section of the version.
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  stage:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the short-lived npm token of trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # no registry-url: its .npmrc carries a placeholder token that npm sends instead of the OIDC one (E401)
      - name: npm with staged publishing
        run: npm install -g npm@^11.15.0
      - name: Tag matches the package version
        run: |
          want=$(node -p "require('./package.json').version")
          [ "${GITHUB_REF_NAME#v}" = "$want" ] || { echo "tag $GITHUB_REF_NAME, package.json $want" >&2; exit 1; }
      - run: npm ci
      # the CI job above has run the tests and the package test on this commit
      - run: npm run build
      # verbose: npm logs why the OIDC token exchange was refused only at this level
      - run: npm stage publish --ignore-scripts --loglevel verbose

  github-release:
    needs: stage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} /^\[[^]]*\]: / {next} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "no CHANGELOG section for $v" >&2; exit 1; }
          printf '\nnpm: https://www.npmjs.com/package/plgauge/v/%s\n' "$v" >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "plgauge $v" --notes-file notes.md --verify-tag
